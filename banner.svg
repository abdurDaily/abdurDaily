<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Md Abdur Rahman, Full Stack Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#132544"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1130" cy="40" r="220" fill="#38BDF8" fill-opacity="0.06"/>
  <circle cx="1210" cy="300" r="160" fill="#818CF8" fill-opacity="0.07"/>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="80" y="86" width="56" height="4" rx="2" fill="url(#accent)"/>
    <text x="80" y="150" font-size="52" font-weight="700" fill="#F8FAFC">Md Abdur Rahman</text>
    <text x="80" y="196" font-size="24" font-weight="500" fill="#CBD5E1">Full Stack Web Developer  ·  Laravel  ·  React  ·  Next.js</text>
    <text x="80" y="244" font-size="17" fill="#94A3B8">Building fast, reliable web applications for clients in the USA and Bangladesh</text>
  </g>

  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#64748B">
    <text x="870" y="128">const developer = {</text>
    <text x="890" y="152"><tspan fill="#7DD3FC">stack</tspan>: ["Laravel", "React", "Next.js"],</text>
    <text x="890" y="176"><tspan fill="#7DD3FC">based</tspan>: "Chittagong, Bangladesh",</text>
    <text x="890" y="200"><tspan fill="#7DD3FC">open</tspan>: <tspan fill="#A5B4FC">true</tspan></text>
    <text x="870" y="224">};</text>
  </g>
</svg>
